<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Cristian Trifan</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/site.css" />
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
        } catch (e) {}
      })();
    </script>
    <style>
      .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; }
      .lost .wrap { max-width: 46ch; }
      .lost .code { font-family: var(--mono); font-size: var(--fs-micro); letter-spacing: 0.14em;
                    text-transform: uppercase; color: var(--slate); margin-bottom: 18px; }
      .lost h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 700; letter-spacing: -0.032em; line-height: 1.1; }
      .lost p { margin-top: 18px; color: var(--slate); }
      .lost .button { margin-top: 32px; }
    </style>
  </head>
  <body>
    <main class="lost">
      <div class="wrap">
        <p class="code">Error 404</p>
        <h1>That page doesn't exist.</h1>
        <p>The link may be out of date, or the address slightly off.</p>
        <a class="button" href="/">
          Back to the homepage
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"
               style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">
            <path d="M5 12h13M13 6.5 18.5 12 13 17.5" />
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
